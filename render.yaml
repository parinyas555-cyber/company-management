services:
  - type: web
    name: company-management
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health.php
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: company-management-db
          property: connectionString
      - key: APP_NAME
        value: Company Management

databases:
  - name: company-management-db
    plan: free
    databaseName: company_management
    user: company_admin
